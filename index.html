<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="En algún lugar de un bosque encantado... Una experiencia de cumpleaños interactiva.">
    <title>🌿 El Bosque Encantado 🧝‍♀️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400;1,600&family=Great+Vibes&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/intro.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="forest-backdrop"></div>
    <canvas id="particles-canvas" class="ambient-canvas"></canvas>
    <div id="cursor-magic-light" class="cursor-light"></div>
    <div class="mystic-fog-layer"></div>

    <header class="hud-controls" aria-label="Controles">
        <div></div>
        <button id="music-toggle" class="music-toggle-btn" aria-label="Música mágica" title="Activar música">
            <div class="music-wave-bars">
                <span></span><span></span><span></span>
            </div>
        </button>
    </header>

    <main class="intro-page-container">
        <div class="intro-mystic-rune-circle" id="secret-intro-rune" title="Runa milenaria">ᛟ</div>

        <h1 class="intro-whisper-1">En algún lugar de un bosque encantado...</h1>
        <p class="intro-whisper-2">Una pequeña luz está esperando por ti.</p>

        <button class="btn-elven intro-cta-button" data-goto="pages/forest.html" data-transition="fade">
            ✨ COMENZAR LA AVENTURA
        </button>

        <!-- Flecha mágica en el sendero -->
        <div class="intro-path-arrow-wrapper" data-goto="pages/forest.html" data-transition="fade" title="Seguir el sendero hacia el bosque">
            <span class="path-arrow-label">Adentrarse en el sendero</span>
            <div class="path-glowing-arrow">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
            </div>
            <div class="arrow-stardust-trail"></div>
        </div>
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
r
    <script type="module">
        import { NavigationManager } from "./js/navigation.js";
        import { ForestParticleEngine } from "./js/components/particles.js";
        import { MusicManager } from "./js/components/music.js";
        import { CONFIG } from "./js/config.js";

        document.addEventListener("DOMContentLoaded", () => {
            new ForestParticleEngine("particles-canvas");
            new MusicManager(CONFIG);
            NavigationManager.initLinks();
        });
    </script>
</body>
</html>
